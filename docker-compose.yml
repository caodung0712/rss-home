services:
  db:
    image: postgres:17-alpine
    container_name: rss-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: miniflux
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 5s
      timeout: 5s
      retries: 10

  miniflux:
    image: miniflux/miniflux:latest
    container_name: rss-miniflux
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://miniflux:${DB_PASSWORD}@db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
      FETCHER_ALLOW_PRIVATE_NETWORKS: "1"
      POLLING_FREQUENCY: "30"
      MEDIA_PROXY_MODE: all
      CLEANUP_ARCHIVE_READ_DAYS: "180"
      CLEANUP_ARCHIVE_UNREAD_DAYS: "180"
      BASE_URL: ${MINIFLUX_BASE_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: rss-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rsshub:
    image: diygod/rsshub:latest
    container_name: rss-rsshub
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1200/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  apify-bridge:
    build:
      context: ./apify-bridge
    container_name: rss-apify-bridge
    restart: unless-stopped
    environment:
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_MONTHLY_BUDGET_USD: ${APIFY_MONTHLY_BUDGET_USD:-5}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  reader-ui:
    build:
      context: ./reader-ui
    container_name: rss-reader-ui
    restart: unless-stopped
    depends_on:
      miniflux:
        condition: service_healthy
    ports:
      - "${READER_UI_PORT:-3000}:3000"
    environment:
      MINIFLUX_INTERNAL_URL: http://miniflux:8080
      MINIFLUX_API_KEY: ${MINIFLUX_API_KEY:-}
      MINIFLUX_ADMIN_USERNAME: ${MINIFLUX_ADMIN_USERNAME:-admin}
      MINIFLUX_ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
      DATABASE_URL: postgres://miniflux:${DB_PASSWORD}@db/miniflux?sslmode=disable
      REDIS_HOST: redis
      APIFY_BRIDGE_URL: http://apify-bridge:8000
      READER_UI_PASSWORD: ${READER_UI_PASSWORD:-}
      BACKUP_MOUNT_DIR: /backups
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
